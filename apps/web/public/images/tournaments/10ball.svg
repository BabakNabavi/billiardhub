<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="10-BALL tournament">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0D1512"/>
      <stop offset="1" stop-color="#050807"/>
    </linearGradient>

    <!-- هاله‌ی رنگیِ پشتِ توپ — تنها جایی که رنگِ بازی پررنگ دیده می‌شود -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#0ea5e9" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <!-- سایه‌زنیِ کره: منبعِ نور بالا-چپ -->
    <radialGradient id="ball" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#F2EFE6"/>
      <stop offset="0.52" stop-color="#F2EFE6"/>
      <stop offset="1" stop-color="#9A968A"/>
    </radialGradient>

    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="ballClip"><circle cx="858" cy="338" r="196"/></clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- خطوطِ کمکی: زاویه‌ی ضربه. خیلی کم‌رنگ، فقط برای اینکه کادر
       خالی نماند -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1.5">
    <path d="M-40 596 L 1240 196"/>
    <path d="M-40 676 L 1240 276"/>
    <circle cx="858" cy="338" r="274" fill="none" stroke-opacity="0.05"/>
  </g>

  <ellipse cx="858" cy="338" rx="411.6" ry="372.4" fill="url(#glow)"/>

  <!-- سایه‌ی تماسِ توپ با میز -->
  <ellipse cx="858" cy="558" rx="180.32000000000002" ry="26" fill="#000000" opacity="0.42"/>

  <g>
    <circle cx="858" cy="338" r="196" fill="url(#ball)"/>
    
    <!-- نوارِ راه‌راه: بریده به خودِ کره تا لبه‌ها منحنی بمانند -->
    <g clip-path="url(#ballClip)">
      <rect x="662" y="228.24" width="392" height="219.52" fill="#2F6BD8"/>
      <rect x="662" y="228.24" width="392" height="219.52" fill="url(#ball)" opacity="0.34"/>
    </g>
    
    <circle cx="858" cy="338" r="82.32" fill="#FBFAF6"/>
    <text x="858" y="338" fill="#141414" font-family="Arial, Helvetica, sans-serif" font-size="121.52"
          font-weight="700" text-anchor="middle" dominant-baseline="central">10</text>
    <!-- بازتابِ نور -->
    <ellipse cx="787.44" cy="251.76" rx="58.8" ry="43.12"
             fill="url(#spec)" transform="rotate(-24 787.44 251.76)"/>
    <circle cx="858" cy="338" r="196" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- ── متن ── -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="226" fill="#0ea5e9" font-size="21" font-weight="700" letter-spacing="7.5">BILLIARD HUB</text>
    <text x="96" y="330" fill="#FFFFFF" font-size="82" font-weight="700" letter-spacing="-1.5">10-BALL</text>
    <text x="96" y="392" fill="#FFFFFF" fill-opacity="0.52" font-size="26" font-weight="400" letter-spacing="5.5">TOURNAMENT</text>
    <rect x="96" y="428" width="286" height="3" fill="url(#rule)"/>
    <text x="96" y="502" fill="#FFFFFF" fill-opacity="0.34" font-size="17" font-weight="400" letter-spacing="2.4">billiardhub.net</text>
  </g>
</svg>
